<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <title>OathLock — connection paused</title>
    <style>
      :root { color-scheme: dark; background: #0d1117; color: #eef0f2; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
      main { width: min(420px, 100%); border: 1px solid #2a313b; padding: 24px; background: #121820; }
      p { color: #aab3be; line-height: 1.55; }
      button { border: 1px solid #687382; background: transparent; color: inherit; padding: 9px 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <small>OATHLOCK / WATCHFLOOR</small>
      <h1>Connection paused</h1>
      <p>The Watchfloor could not reach OathLock. Reconnect and try again to resume the live workspace.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
