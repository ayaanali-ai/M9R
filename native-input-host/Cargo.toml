[package]
name = "m9r-native-input-host"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "M9R Chrome Native Messaging host for foreground, visible-tab pointer input"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
