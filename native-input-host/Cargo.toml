[package]
name = "m9r-native-input-host"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
description = "M9R Chrome Native Messaging host for foreground, visible-tab pointer input"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
