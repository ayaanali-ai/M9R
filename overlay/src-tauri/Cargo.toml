[package]
name = "m9r-overlay"
version = "0.1.0"
description = "M9R overlay: a small always-on-top pill that shows which agents are open and what needs you."
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

# `custom-protocol` makes the binary serve the bundled `frontendDist` (dist/) instead of falling back to
# tauri.conf.json's `devUrl` (http://localhost:5173). The Tauri CLI (`tauri build`/`tauri dev`) injects this
# feature automatically via `--features tauri/custom-protocol`; a plain `cargo build --release` -- which is how
# this project's own build steps invoke it -- never did, so every release build made that way tried to load a dev
# server that wasn't running and showed WebView2's own connection-failed page instead of the pill. Confirmed live
# 2026-09-22 via the Chrome DevTools Protocol (WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--remote-debugging-port):
# the loaded page URL was literally "http://localhost:5173/". Unconditional here (not feature-gated) so a bare
# `cargo build --release` is always correct, regardless of who builds it or with what command.
tauri = { version = "2", features = ["tray-icon", "devtools", "custom-protocol"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Registers a PermissionRequested handler so the pill's own WebView2 window auto-approves microphone access for
# hold-to-talk; see allow_microphone_permission in main.rs for why this is needed. Versions match what tauri/wry
# already resolve (see Cargo.lock) so this does not pull in a second copy.
webview2-com = "0.38"
# Native dictation (native_dictation.rs) used WinRT's Windows.Media.SpeechRecognition at first, but that API
# requires MSIX package identity -- confirmed live 2026-10-31: this app ships unpackaged (NSIS only, see
# tauri.conf.json's bundle.targets), so CompileConstraintsAsync() silently hung forever instead of erroring,
# and the mic was never actually touched (zero entries ever appeared in the Windows mic-consent registry for
# this exe across an entire investigation). Classic SAPI5 (Win32_Media_Speech, the COM ISpRecognizer/
# ISpRecoContext/ISpRecoGrammar interfaces, not the Automation-friendly ISpeech* ones) has always supported
# unpackaged Win32 processes, so native_dictation.rs now drives that instead. "Win32_System_Com" is needed for
# CoCreateInstance/CoInitializeEx; "Win32_System_WinRT" is no longer needed for speech but Win32_System_WinRT's
# RoInitialize is still harmless to keep off the thread (removed, SAPI uses plain COM apartment init instead).
windows = { version = "0.61", features = [
    "Win32_Media_Speech", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading",
    # A bare Ctrl+Alt (no letter) hold-to-talk hotkey cannot be registered through Win32's
    # RegisterHotKey (which tauri-plugin-global-shortcut wraps) -- it requires a non-modifier
    # virtual key. ctrl_alt_hold.rs instead tracks raw key state through a WH_KEYBOARD_LL hook.
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
