<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M9R · Notch preview</title><link rel="stylesheet" href="./src/notch-preview.css"></head>
<body><main id="notch"><svg id="outline" aria-hidden="true"><path fill="#09090a"/></svg><button id="toggle" aria-expanded="false" aria-controls="sheet" aria-label="Open conversation"></button>

<div class="edge left" data-side="-1"></div><div class="edge right" data-side="1"></div><div class="edge bottom"></div><div class="edge corner" data-side="1"></div></main>
<aside>Local design preview · Sample conversation</aside><script type="module" src="./src/notch-preview.js"></script></body></html>
