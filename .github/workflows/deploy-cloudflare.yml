name: Deploy to Cloudflare

# Runs after CI passes on main (or by hand). The OpenNext packager needs symlinks, which Windows blocks, so this builds on Linux.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # NEXT_PUBLIC_* values are inlined at build time. They are public and already live in wrangler.jsonc, so read them from there.
      - name: Load public build variables from wrangler.jsonc
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, "");
            const vars = JSON.parse(text).vars || {};
            const lines = Object.entries(vars).filter(([k]) => k.startsWith("NEXT_PUBLIC_")).map(([k, v]) => `${k}=${v}`);
            fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
          '
      - run: npx opennextjs-cloudflare build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
